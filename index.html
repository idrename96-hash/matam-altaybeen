<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة سحب - مطعم الطيبين</title>
    <!-- استيراد خط كايو الأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- استيراد أيقونات FontAwesome للواتساب -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #d32f2f;
            --dark-yellow: #fbc02d;
            --accent-yellow: #ffeb3b;
            --bg-color: #fffde7;
            --text-color: #333333;
        }

        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-red), #b71c1c);
            color: white;
            text-align: center;
            padding: 25px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border-bottom: 5px solid var(--dark-yellow);
            position: relative;
        }

        /* شريط خصومات 50% البارز في أعلى الهيدر */
        .discount-badge {
            background-color: var(--dark-yellow);
            color: #b71c1c;
            font-size: 15px;
            font-weight: 900;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .logo-container {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 3px solid var(--dark-yellow);
            overflow: hidden;
        }

        .logo-container i {
            font-size: 36px;
            color: var(--primary-red);
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(211, 47, 47, 0.15);
            width: 100%;
            max-width: 420px;
            border-top: 6px solid var(--dark-yellow);
        }

        h2 {
            text-align: center;
            color: var(--primary-red);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--dark-yellow);
            outline: none;
            box-shadow: 0 0 5px rgba(251, 192, 45, 0.4);
        }

        button {
            width: 100%;
            background-color: var(--primary-red);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
            transition: all 0.3s;
        }

        button:hover {
            background-color: #b71c1c;
            transform: translateY(-2px);
        }

        .whatsapp-section {
            margin-top: 25px;
            text-align: center;
            border-top: 2px dashed #eee;
            padding-top: 20px;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: background 0.3s;
        }

        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }

        .whatsapp-btn i {
            font-size: 22px;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #333;
            color: #ffeb3b;
            font-size: 14px;
            font-weight: 600;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <div class="discount-badge">
            <i class="fa-solid fa-tag"></i> خصومات 50% على الوجبات!
        </div>
        <div class="logo-container">
            <i class="fa-solid fa-utensils"></i>
        </div>
        <h1>مطعم الطيبين</h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>سجل معنا في مسابقة السحب</h2>
            <form id="sweepstakesForm">
                <div class="form-group">
                    <label for="name">الاسم:</label>
                    <input type="text" id="name" name="name" required placeholder="أدخل اسمك الكامل">
                </div>
                <div class="form-group">
                    <label for="phone">رقم الجوال:</label>
                    <input type="tel" id="phone" name="phone" required placeholder="05xxxxxxxx">
                </div>
                <button type="submit" id="submitBtn">إرسال المشاركة</button>
                <p id="message"></p>
            </form>

            <div class="whatsapp-section">
                <a href="https://whatsapp.com/channel/0029VbDVQ526LwHixlJKam0a" target="_blank" class="whatsapp-btn">
                    <i class="fa-brands fa-whatsapp"></i> تابعنا على الواتس
                </a>
            </div>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © مطعم الطيبين
    </footer>

    <script>
        // ضع هنا الرابط الجديد الذي نسخته من جوجل شيت
        const scriptURL = 'https://script.google.com/macros/s/AKfycby-Gqxk3D1LfQ3WhHllEv1kOGmWu4D5M85wN3K0C2Z1XjXfTF2IJmTHFgEn1XYTg_rl/exec';

        const form = document.getElementById('sweepstakesForm');
        const submitBtn = document.getElementById('submitBtn');
        const message = document.getElementById('message');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            if (scriptURL === 'ضع_رابط_الـ_Web_App_هنا') {
                message.textContent = 'تم محاكاة الإرسال بنجاح! (قم بربط الرابط الفعلي لاحقاً)';
                message.style.color = 'green';
                form.reset();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الإرسال...';

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => response.json()) // قراءة رد جوجل شيت
                .then(data => {
                    if(data.result === 'error') {
                        // حالة تكرار الرقم
                        message.textContent = data.message;
                        message.style.color = 'red';
                    } else {
                        // حالة النجاح
                        message.textContent = data.message;
                        message.style.color = 'green';
                        form.reset();
                    }
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'إرسال المشاركة';
                })
                .catch(error => {
                    message.textContent = 'حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.';
                    message.style.color = 'red';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'إرسال المشاركة';
                });
        });
    </script>

</body>
</html>
